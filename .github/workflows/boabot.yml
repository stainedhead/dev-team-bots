name: boabot

on:
  push:
    branches: [main]
    paths:
      - 'boabot/**'
      - '.github/workflows/boabot.yml'
  pull_request:
    branches: [main]
    paths:
      - 'boabot/**'
      - '.github/workflows/boabot.yml'

defaults:
  run:
    working-directory: boabot

env:
  GO_VERSION: '1.26'
  AWS_REGION: us-east-1
  ECR_REPOSITORY: boabot

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: boabot/go.sum

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run

      - name: Test
        # -gcflags=all=-d=checkptr=0 works around a confirmed upstream
        # unsafe.Pointer bug in fiatjaf.com/nostr's event-signing code that
        # otherwise aborts `-race` non-deterministically. See
        # specs/260804-boabot-buzz-support/research.md ("Critical finding",
        # Phase D) and implementation-notes.md's Deviations from Plan.
        run: go test -race -gcflags=all=-d=checkptr=0 ./...

      - name: Coverage check
        run: |
          CORE_PKGS=$(go list ./internal/domain/... ./internal/application/... | grep -v /mocks)
          go test -race -gcflags=all=-d=checkptr=0 -coverprofile=coverage.out $CORE_PKGS
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Domain+Application Coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 90) { print \"Coverage ${COVERAGE}% is below 90% threshold\"; exit 1 } }"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: boabot/go.sum

      - name: Build
        run: go build -o bin/boabot ./cmd/boabot

  containerize:
    name: Containerize
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.build-push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${REGISTRY}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          docker build -t "${IMAGE}" -f deployments/Dockerfile .
          docker push "${IMAGE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: containerize
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node (CDK)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CDK dependencies
        run: cd cdk && npm ci

      - name: CDK deploy (shared stack)
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: cd cdk && npx cdk deploy --require-approval never

  # release-please maintains an up-to-date "chore(main): release boabot
  # X.Y.Z" PR on every push to main, parsing conventional-commit messages
  # (feat:/fix:/BREAKING CHANGE) since the last release to compute the next
  # semver bump automatically -- no manual version file or tag to remember.
  # Runs at the repo root (release-please-config.json / manifest live
  # there, not under boabot/, since it's a manifest-driven tool) even
  # though this workflow's other jobs default to the boabot/ working
  # directory.
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['boabot--release_created'] }}
      tag_name: ${{ steps.release.outputs['boabot--tag_name'] }}
      version: ${{ steps.release.outputs['boabot--version'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # AGENTS.md: "After opening a PR ... immediately enable automerge.
      # This applies to every PR opened in this repo, with no exceptions."
      # release-please's own release PR is no exception -- this makes the
      # whole pipeline hands-off: land a conventional-commit-tagged change
      # on main, and (once the release PR itself merges) a tagged release
      # and its binary follow with no manual click. Found via the
      # `autorelease: pending` label release-please applies to its own
      # release PRs by default (a documented, stable convention) rather
      # than a step output, since this action's outputs are not statically
      # declared and an unverified output name would fail silently.
      - name: Enable automerge on the release-please PR
        # Override the workflow-level `defaults.run.working-directory:
        # boabot` -- this job never checks out the repo (the
        # release-please-action step above doesn't need it, and this step
        # only calls `gh` with --repo, touching no local files), so `boabot/`
        # doesn't exist on the runner and the default would fail with
        # "No such file or directory".
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" \
            --label "autorelease: pending" --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            exit 0
          fi

          # enablePullRequestAutoMerge (what `gh pr merge --auto` calls
          # under the hood) can transiently fail with GraphQL "Pull
          # request is in unstable status" right after a PR is created or
          # updated, before GitHub finishes computing its mergeable
          # status -- a documented race
          # (https://github.com/peter-evans/enable-pull-request-automerge/issues/355
          # and similar), not a real blocker. Retry a few times first.
          for attempt in 1 2 3; do
            if gh pr merge --auto --squash "$PR_NUMBER" --repo "${{ github.repository }}"; then
              exit 0
            fi
            echo "attempt $attempt: enablePullRequestAutoMerge failed (likely the unstable-status race), retrying..."
            sleep 5
          done

          # This repo has no required status checks today, so a direct
          # merge is exactly as safe as the auto-merge --auto was trying
          # to set up (nothing to wait for) -- fall back to it rather
          # than leave the release PR stuck if the race persists.
          echo "auto-merge retries exhausted, falling back to a direct merge"
          gh pr merge --squash "$PR_NUMBER" --repo "${{ github.repository }}"

  # Builds and attaches the macOS (Apple Silicon) binary to the GitHub
  # Release release-please just created. Only runs on the merge that
  # actually cuts a release (release_created == 'true'), not on every
  # ordinary merge to main.
  release-binary:
    name: Release Binary (macOS arm64)
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: boabot/go.sum

      - name: Build darwin/arm64 binary
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 go build \
            -ldflags="-X main.version=${{ needs.release-please.outputs.version }}" \
            -o dist/boabot-darwin-arm64 ./cmd/boabot

      - name: Attach binary to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: boabot/dist/boabot-darwin-arm64
