# Tech Lead bot configuration

bot:
  name: tech-lead
  type: tech-lead

# Buzz (Nostr) workspace membership — see boabot/user-docs/Buzz-Adoption-Config.md.
# The private key is NOT here: provision it with
#   boabotctl secret set buzz_private_key --bot tech-lead
buzz:
  enabled: true
  relay_url: wss://feral-sysd.communities.buzz.xyz
  bot_name: tech-lead

models:
  default: ollama-chat
  providers:
    - name: ollama-chat
      type: openai
      model_id: qwen3.6:35b-a3b-coding-bf16
      endpoint: http://localhost:11434/v1
